<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate QR Code</title>
  <style> 
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: gray;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    
    h2 {
      margin-bottom: 20px;
      font-size:x-large;
      color:black;
      margin-right: 20px;
    }
    
    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;

    }
    
   .input {
      padding: 10px;
      font-size: 1rem;
      border-radius: 10px;
      border:black;
    
    }
    
    button {
      padding: 10px;
      font-size:medium;
      background-color: #007BFF;
      color:white;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    
    button:hover {
      background-color: #0056b3;
    }
    .qr-container {
      margin-top: 20px;
    }
    
    #qrCodeImage {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
    }
    </style>
</head>
<body>
  <h2>Generate QR Code for Your Grocery List</h2>
  <form id="qrForm">
    <input type="text" id="qrData" placeholder="Enter grocery list" required>
    <button type="submit">Generate QR Code</button>
  </form>

  <div id="qrCodeContainer" style="margin-top: 20px;">
    <img id="qrCodeImage" src="" alt="QR Code" style="max-width: 300px; display: none;">
  </div>

  <script>
    document.getElementById('qrForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const qrData = document.getElementById('qrData').value;

      // Send a POST request to the backend API to generate the QR code
      const response = await fetch('http://localhost:5000/generate-qr', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ data: qrData }),
      });

      const result = await response.json();

      // If QR code generated successfully, show it
      if (result.success) {
        const qrCodeImage = document.getElementById('qrCodeImage');
        qrCodeImage.src = result.qrCodeImage;
        qrCodeImage.style.display = 'block';
      } else {
        alert(result.message);
      }
    });
  </script>
</body>
</html>
