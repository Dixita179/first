<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    /* Basic Styles for Body */
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Container Styling */
    .container {
      background-color: #e0f7fa; /* Light blue background color for the container */
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    /* Header Styling */
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    /* Input Styling */
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    /* Button Styling */
    button {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    /* Button Hover Effect */
    button:hover {
      background-color: #0056b3;
    }

    /* Message Styling */
    .message {
      text-align: center;
      margin-top: 15px;
    }

    /* Error Message Styling */
    .error {
      color: red;
    }

    /* Success Message Styling */
    .success {
      color: green;
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="username" placeholder="Username" required><br>
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit">Register</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Simple validation for empty fields
      if (!username || !email || !password) {
        alert("All fields are required!");
        return;
      }

      // Send POST request to backend
      try {
        const response = await fetch('http://localhost:5000/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (response.status === 201) {
          alert(data.message);  // Success - Show the success message in an alert
        } else {
          alert(data.message);  // Error - Show the error message in an alert
        }
      } catch (error) {
        alert('Error: ' + error.message);  // Show any errors in an alert
      }
    });
  </script>
</body>
</html>
