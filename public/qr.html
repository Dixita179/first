<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate QR Code</title>
  <style> 
    body {
      font-family: Arial, sans-serif;
      background-color: #e9edeed7; /* Light cyan background for the page */
      color: rgb(125, 186, 199);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    
    .container {
      background: #429096;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px; /* Increased max-width for more space */
      width: 100%;
    }
    
    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: black;
      font-weight: 600;
    }
    
    .form {
      display: flex;
      flex-direction: column;
      gap: 20px; /* Increased gap for better spacing between elements */
    }
    
    .input {
      padding: 15px; /* Increased padding for more comfortable input */
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s ease;
      width: 100%; /* Ensures the input fills the container */
      min-height: 120px; /* Increased height to allow for multiple lines of text */
      box-sizing: border-box; /* Includes padding in width/height calculation */
    }

    .input:focus {
      border-color: #007BFF;
    }

    button {
      padding: 12px;
      font-size: 1rem;
      background-color: #007BFF;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s ease;
    }
    
    button:hover {
      background-color: #0056b3;
    }

    .qr-container {
      margin-top: 20px;
    }

    #qrCodeImage {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      display: none;
    }

    /* Add mobile-friendly adjustments */
    @media screen and (max-width: 600px) {
      .container {
        padding: 15px;
        width: 90%;
      }
      
      h2 {
        font-size: 20px;
      }

      button {
        font-size: 1rem;
        padding: 10px;
      }

      .input {
        padding: 12px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Generate QR Code for Your Grocery List</h2>
    <form id="qrForm" class="form">
      <textarea id="qrData" class="input" placeholder="Enter grocery list" required></textarea>
      <button type="submit">Generate QR Code</button>
    </form>

    <div id="qrCodeContainer" class="qr-container">
      <img id="qrCodeImage" src="" alt="QR Code">
    </div>
  </div>

  <script>
    document.getElementById('qrForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const qrData = document.getElementById('qrData').value;

      // Send a POST request to the backend API to generate the QR code
      const response = await fetch('http://localhost:5000/generate-qr', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ data: qrData }),
      });

      const result = await response.json();

      // If QR code generated successfully, show it
      if (result.success) {
        const qrCodeImage = document.getElementById('qrCodeImage');
        qrCodeImage.src = result.qrCodeImage;
        qrCodeImage.style.display = 'block';
      } else {
        alert(result.message);
      }
    });
  </script>
</body>
</html>
